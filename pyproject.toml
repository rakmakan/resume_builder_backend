[tool.poetry]
name = "career-advisor"
version = "0.1.0"
description = "Career Advisor Agent System"
authors = ["AI <ai@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
"pydantic-ai-slim" = { version = "*", extras = ["mcp"] }
"pydantic-graph" = "*"
"httpx" = "*"
"fastapi" = "*"
"logfire" = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
