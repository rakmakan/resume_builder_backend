[project]
name = "career-advisor"
version = "0.1.0"
description = "Career Advisor Agent System"
authors = [{name = "AI", email = "ai@example.com"}]
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[mcp]",
    "pydantic-graph",
    "httpx",
    "fastapi",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
